      { id:"straw_mulch", name:"Straw Mulch Bales (2 bales)", shopCat:"topdressings", season:"any", situations:["renovation_kill","renovation_nokill","new_construction","overseed"], price:"$8–$12 each", where:"Home Depot / Tractor Supply", researchNote:"Light straw on slopes prevents seed washout during germination watering. Apply 1 bale per 1,000 sq ft — still see ~50% soil through the straw." },
    ];

    const CATEGORY_COLORS = {
      soil:        { bg: "#EAF3DE", text: "#3B6D11", border: "#639922", label: "Soil" },
      weed:        { bg: "#FCEBEB", text: "#A32D2D", border: "#E24B4A", label: "Weed Control" },
      renovation:  { bg: "#E6F1FB", text: "#185FA5", border: "#378ADD", label: "Renovation" },
      fertilizer:  { bg: "#FAEEDA", text: "#854F0B", border: "#BA7517", label: "Fertilizer" },
      maintenance: { bg: "#E1F5EE", text: "#0F6E56", border: "#1D9E75", label: "Maintenance" },
      planning:    { bg: "#EEEDFE", text: "#534AB7", border: "#7F77DD", label: "Planning" },
    };
    const PRIORITY_COLORS = {
      critical: { bg: "#FCEBEB", text: "#A32D2D", dot: "#E24B4A" },
      high:     { bg: "#FAEEDA", text: "#854F0B", dot: "#EF9F27" },
      medium:   { bg: "#EAF3DE", text: "#3B6D11", dot: "#63992" },
    };
    const ZONES = ["1a","1b","2a","2b","3a","3b","4a","4b","5a","5b","6a","6b","7a","7b","8a","8b","9a","9b","10a","10b","11a","11b","12a","12b","13a","13b"];
    const GRASS_TYPES = {
      "Cool-Season": ["Bentgrass","Kentucky Bluegrass","Perennial Ryegrass","Fine Fescue","Tall Fescue"],
      "Warm-Season": ["Bahia","Bermuda","Centipede","St. Augustine","Zoysia"],
    };
    const YEAR_FOCUS = {
      renovation_kill:   ["Kill & seed","Fill & protect","Thicken","Mature","Show lawn"],
      renovation_nokill: ["Prep & seed","Fill & protect","Thicken","Mature","Show lawn"],
      new_construction:  ["Build & seed","Establish","Thicken","Maintain","Sustain"],
      overseed:          ["Overseed & fill","Dense up","Maintain","Sustain","Thrive"],
      maintenance:       ["Spring start","Build density","Sustain","Improve","Peak lawn"],
    };

    const defaultData = () => ({
      year: new Date().getFullYear(),
      budget: "medium",
      situation: null,
      hasCompletedSetup: false,
      disabledTasks: [],
      addedTasks: [],
      completedTasks: {},
      notes: {},
      location: "",
      zone: "6a",
      grassType: "Kentucky Bluegrass",
    });

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return { ...defaultData(), ...JSON.parse(raw) };
      } catch {}
      return defaultData();
    }
    function saveData(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
    }
    function getTaskKey(taskId, year, month) { return `${taskId}_${year}_${month}`; }

    function LawnPro() {
      const [data, setData] = useState(loadData);
      const [activeMonth, setActiveMonth] = useState(new Date().getMonth());
      const [activeTask, setActiveTask] = useState(null);
      const [view, setView] = useState("calendar");
      const [yearOffset, setYearOffset] = useState(0);
      const [exportMsg, setExportMsg] = useState(null);
      const [shopSubview, setShopSubview] = useState("all");
      const [libSubview, setLibSubview] = useState("all");
      const [showAllLibProducts, setShowAllLibProducts] = useState(false);
      const [setupStep, setSetupStep] = useState(1);
      const [wizardData, setWizardData] = useState(() => ({
        situation: null,
        location: data.location || "",
        zone: data.zone || "6a",
        grassType: data.grassType || "Kentucky Bluegrass",
        budget: data.budget || "medium",
      }));
      const importRef = useRef(null);
      const currentYear = data.year + yearOffset;

      useEffect(() => { saveData(data); }, [data]);

      const getTasksThisYear = useCallback(() => {
        const sit = data.situation;
        if (!sit) return [];
        return TASK_CATALOG.filter(t => {
          if (!t.situations.includes(sit) && !(data.addedTasks || []).includes(t.id)) return false;
          if ((data.disabledTasks || []).includes(t.id)) return false;
          return t.recurrYears.includes(yearOffset + 1);
        });
      }, [yearOffset, data.situation, data.disabledTasks, data.addedTasks]);

      const monthTasks = useCallback((month) => getTasksThisYear().filter(t => t.month === month + 1), [getTasksThisYear]);
      const isCompleted = (taskId, month) => !!(data.completedTasks || {})[getTaskKey(taskId, currentYear, month)];
      const toggleComplete = (taskId, month) => {
        const key = getTaskKey(taskId, currentYear, month);
        setData(d => ({ ...d, completedTasks: { ...d.completedTasks, [key]: !d.completedTasks[key] } }));
      };
      const getMonthProgress = (month) => {
        const tasks = monthTasks(month);
        if (!tasks.length) return null;
        const done = tasks.filter(t => isCompleted(t.id, month + 1)).length;
        return { done, total: tasks.length, pct: Math.round((done / tasks.length) * 100) };
      };
      const getPriorityTasks = () => {
        const now = new Date(), month = now.getMonth();
        const upcoming = [];
        for (let m = month; m <= month + 2; m++) {
          const idx = m % 12;
          monthTasks(idx).forEach(t => { if (!isCompleted(t.id, idx + 1)) upcoming.push({ ...t, month: idx }); });
        }
        return upcoming.sort((a, b) => ({ critical:0, high:1, medium:2 }[a.priority] - { critical:0, high:1, medium:2 }[b.priority])).slice(0, 5);
      };
      const totalTasksYear = getTasksThisYear().length;
      const completedYear = getTasksThisYear().filter(t => isCompleted(t.id, t.month)).length;
      const catStyle = (cat) => CATEGORY_COLORS[cat] || CATEGORY_COLORS.maintenance;
      const getAllNotes = () =>
        getTasksThisYear()
          .filter(t => (data.notes || {})[getTaskKey(t.id, currentYear, t.month)])
          .map(t => ({ task: t, text: data.notes[getTaskKey(t.id, currentYear, t.month)] }))
          .sort((a, b) => a.task.month - b.task.month);

      const completeSetup = () => {
        if (!wizardData.situation) return;
        setData(d => ({ ...d, ...wizardData, hasCompletedSetup: true }));
      };

      const exportData = () => {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const date = new Date().toISOString().slice(0, 10);
        const filename = `lawn-pro-backup-${date}.json`;
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        setExportMsg(filename);
        setTimeout(() => {
          const subject = encodeURIComponent('Lawn Pro Calendar Backup');
          const body = encodeURIComponent(`Attach the downloaded file "${filename}" to transfer your lawn care progress to another device.`);
          window.open(`mailto:?subject=${subject}&body=${body}`);
        }, 400);
      };
      const importData = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (window.confirm('Replace all current progress and notes with the imported data?')) setData({ ...defaultData(), ...parsed });
          } catch { alert('Could not read the file. Make sure it is a Lawn Pro backup (.json).'); }
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      // ===== SETUP WIZARD =====
      if (!data.situation) {
        const btnBase = { padding:"10px 16px", fontSize:13, borderRadius:"var(--border-radius-md)", cursor:"pointer", fontFamily:"var(--font-sans)", border:"0.5px solid var(--color-border-tertiary)", background:"var(--color-background-primary)", color:"var(--color-text-primary)" };
        const step = setupStep;
        return (
          <div style={{ minHeight:"100vh", background:"var(--color-background-tertiary)", display:"flex", flexDirection:"column", alignItems:"center", padding:"40px 20px", fontFamily:"var(--font-sans)" }}>
            <div style={{ maxWidth:740, width:"100%" }}>
              <div style={{ textAlign:"center", marginBottom:32 }}>
                <span style={{ fontSize:36, lineHeight:1 }}>🌿</span>
                <h1 style={{ margin:"10px 0 4px", fontSize:26, fontWeight:500, color:"var(--color-text-primary)", fontFamily:"'Georgia',serif" }}>Lawn Pro Calendar</h1>
                <p style={{ margin:0, fontSize:14, color:"var(--color-text-secondary)" }}>Let's build your personalized lawn care program</p>
              </div>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:0, marginBottom:32 }}>
                {[1,2,3,4].map((s, i) => (
                  <React.Fragment key={s}>
                    <div style={{ width:30, height:30, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, fontWeight:600, background: s <= step ? "#1D9E75" : "var(--color-background-secondary)", color: s <= step ? "#fff" : "var(--color-text-tertiary)", border: s <= step ? "none" : "0.5px solid var(--color-border-tertiary)" }}>{s <= step && s < step ? "✓" : s}</div>
                    {i < 3 && <div style={{ width:50, height:2, background: s < step ? "#1D9E75" : "var(--color-border-tertiary)" }} />}
                  </React.Fragment>
                ))}
              </div>
              <div style={{ background:"var(--color-background-primary)", borderRadius:"var(--border-radius-lg)", border:"0.5px solid var(--color-border-tertiary)", padding:"28px 28px 24px" }}>
                {step === 1 && (
                  <div>
                    <h2 style={{ margin:"0 0 6px", fontSize:20, fontWeight:500 }}>What's your lawn situation?</h2>
                    <p style={{ margin:"0 0 20px", fontSize:13, color:"var(--color-text-secondary)" }}>Choose the option that best describes where your lawn is today.</p>
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(280px, 1fr))", gap:10 }}>
                      {Object.entries(SITUATIONS).map(([key, sit]) => {
                        const selected = wizardData.situation === key;
                        return (
                          <button key={key} onClick={() => { setWizardData(d => ({...d, situation:key})); setSetupStep(2); }}
                            style={{ ...btnBase, textAlign:"left", padding:"16px", border: selected ? `1.5px solid #1D9E75` : "0.5px solid var(--color-border-tertiary)", background: selected ? "#F0FAF5" : "var(--color-background-primary)", display:"flex", flexDirection:"column", gap:6 }}>
                            <div style={{ fontSize:24, lineHeight:1 }}>{sit.icon}</div>
                            <div style={{ fontSize:14, fontWeight:600, color:"var(--color-text-primary)" }}>{sit.label}</div>
                            <div style={{ fontSize:12, color:"var(--color-text-secondary)", lineHeight:1.5 }}>{sit.description}</div>
                            <span style={{ fontSize:11, padding:"2px 8px", borderRadius:99, background:sit.badge.bg, color:sit.badge.color, alignSelf:"flex-start", marginTop:2 }}>{sit.badge.text}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
                {step === 2 && (
                  <div>
                    <h2 style={{ margin:"0 0 6px", fontSize:20, fontWeight:500 }}>Where is your lawn?</h2>
                    <p style={{ margin:"0 0 20px", fontSize:13, color:"var(--color-text-secondary)" }}>Used to provide region-specific timing guidance.</p>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:20 }}>
                      <div>
                        <div style={{ fontSize:11, fontWeight:500, color:"var(--color-text-secondary)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:6 }}>📍 Location</div>
                        <input type="text" value={wizardData.location} onChange={e => setWizardData(d => ({...d, location:e.target.value}))} placeholder="City, State"
                          style={{ width:"100%", fontSize:13, padding:"8px 10px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-tertiary)", fontFamily:"var(--font-sans)", color:"var(--color-text-primary)", background:"var(--color-background-primary)" }} />
                      </div>
                      <div>
                        <div style={{ fontSize:11, fontWeight:500, color:"var(--color-text-secondary)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:6 }}>🌡 USDA Zone</div>
                        <select value={wizardData.zone} onChange={e => setWizardData(d => ({...d, zone:e.target.value}))}
                          style={{ width:"100%", fontSize:13, padding:"8px 10px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-tertiary)", fontFamily:"var(--font-sans)", color:"var(--color-text-primary)", background:"var(--color-background-primary)" }}>
                          {ZONES.map(z => <option key={z} value={z}>Zone {z}</option>)}
                        </select>
                      </div>
                    </div>
                    <img src="https://planthardiness.ars.usda.gov/images/phzm_us.jpg" alt="USDA Zone Map" referrerPolicy="no-referrer"
                      style={{ width:"100%", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-tertiary)", marginBottom:20, display:"block" }}
                      onError={e => { e.target.style.display="none"; }} />
                    <div style={{ display:"flex", justifyContent:"space-between" }}>
                      <button onClick={() => setSetupStep(1)} style={{ ...btnBase }}>← Back</button>
                      <button onClick={() => setSetupStep(3)} style={{ ...btnBase, background:"#1D9E75", color:"#fff", border:"none", fontWeight:500 }}>Next →</button>
                    </div>
                  </div>
                )}
                {step === 3 && (
                  <div>
                    <h2 style={{ margin:"0 0 6px", fontSize:20, fontWeight:500 }}>What kind of grass do you have?</h2>
                    <p style={{ margin:"0 0 20px", fontSize:13, color:"var(--color-text-secondary)" }}>Used to filter compatible products and timing.</p>
                    <div style={{ marginBottom:16 }}>
                      <div style={{ fontSize:11, fontWeight:500, color:"var(--color-text-secondary)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:6 }}>🌿 Grass Type</div>
                      <select value={wizardData.grassType} onChange={e => setWizardData(d => ({...d, grassType:e.target.value}))}
                        style={{ width:"100%", fontSize:13, padding:"8px 10px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-tertiary)", fontFamily:"var(--font-sans)", color:"var(--color-text-primary)", background:"var(--color-background-primary)" }}>
                        {Object.entries(GRASS_TYPES).map(([season, grasses]) => (
                          <optgroup key={season} label={season}>{grasses.map(g => <option key={g} value={g}>{g}</option>)}</optgroup>
                        ))}
                      </select>
                    </div>
                    <img src="https://agreenhand.com/wp-content/uploads/2022/05/10-best-types-of-grass-to-plant.jpg" alt="Grass Types"
                      referrerPolicy="no-referrer" style={{ width:"100%", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-tertiary)", marginBottom:20, display:"block" }}
                      onError={e => { e.target.style.display="none"; }} />
                    <div style={{ display:"flex", justifyContent:"space-between" }}>
                      <button onClick={() => setSetupStep(2)} style={{ ...btnBase }}>← Back</button>
                      <button onClick={() => setSetupStep(4)} style={{ ...btnBase, background:"#1D9E75", color:"#fff", border:"none", fontWeight:500 }}>Next →</button>
                    </div>
                  </div>
                )}
                {step === 4 && (
                  <div>
                    <h2 style={{ margin:"0 0 6px", fontSize:20, fontWeight:500 }}>What's your budget?</h2>
                    <p style={{ margin:"0 0 20px", fontSize:13, color:"var(--color-text-secondary)" }}>Tasks and products are filtered to match your budget level. You can change this any time.</p>
                    <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:24 }}>
                      {Object.entries(BUDGET_TIERS).map(([key, label]) => (
                        <button key={key} onClick={() => setWizardData(d => ({...d, budget:key}))}
                          style={{ ...btnBase, padding:"14px 16px", textAlign:"left", border: wizardData.budget===key ? "1.5px solid #1D9E75" : "0.5px solid var(--color-border-tertiary)", background: wizardData.budget===key ? "#F0FAF5" : "var(--color-background-primary)" }}>
                          <div style={{ fontWeight:600, fontSize:14 }}>{key === "low" ? "$" : key === "medium" ? "$$" : "$$$"} {label}</div>
                          <div style={{ fontSize:12, color:"var(--color-text-secondary)", marginTop:3 }}>
                            {key === "low" ? "Core essentials only — seed, fert, basic tools." : key === "medium" ? "Core + herbicide program and equipment rentals." : "Full program including premium products and upgrades."}
                          </div>
                        </button>
                      ))}
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between" }}>
                      <button onClick={() => setSetupStep(3)} style={{ ...btnBase }}>← Back</button>
                      <button onClick={completeSetup} disabled={!wizardData.situation}
                        style={{ ...btnBase, background: wizardData.situation ? "#1D9E75" : "#9ca3af", color:"#fff", border:"none", fontWeight:600, fontSize:14, padding:"12px 24px" }}>
                        Build My Calendar →
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ===== MAIN APP =====
      const sit = SITUATIONS[data.situation];
      return (
        <div style={{ fontFamily:"'Georgia',serif", minHeight:"100vh", background:"var(--color-background-tertiary)", padding:"0 0 60px" }}>

          {/* Header */}
          <div style={{ background:"var(--color-background-primary)", borderBottom:"0.5px solid var(--color-border-tertiary)", padding:"16px 20px" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:22, lineHeight:1 }}>🌿</span>
                <div>
                  <h1 style={{ margin:0, fontSize:20, fontWeight:500, color:"var(--color-text-primary)", letterSpacing:"-0.3px" }}>Lawn Pro Calendar</h1>
                  <p style={{ margin:0, fontSize:12, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)" }}>
                    {data.location ? data.location + " · " : ""}{sit?.icon} {sit?.label} · Zone {data.zone} · {data.grassType}
                  </p>
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
                <div style={{ display:"flex", alignItems:"center", gap:6, fontFamily:"var(--font-sans)", fontSize:13 }}>
                  <label style={{ color:"var(--color-text-secondary)" }}>Budget:</label>
                  <select value={data.budget} onChange={e => setData(d => ({...d, budget:e.target.value}))} style={{ fontSize:13, padding:"4px 8px" }}>
                    {Object.entries(BUDGET_TIERS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
                  </select>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:6, fontFamily:"var(--font-sans)", fontSize:13 }}>
                  <button onClick={() => setYearOffset(y => y - 1)} style={{ padding:"4px 8px", fontSize:13 }}>‹</button>
                  <span style={{ fontWeight:500, minWidth:40, textAlign:"center" }}>Year {yearOffset + 1}</span>
                  <button onClick={() => setYearOffset(y => Math.min(y + 1, 4))} style={{ padding:"4px 8px", fontSize:13 }}>›</button>
                </div>
              </div>
            </div>
            {/* Nav */}
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:4, marginTop:14, fontFamily:"var(--font-sans)", flexWrap:"wrap" }}>
              <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                {[["calendar","📅 Calendar"],["priorities","⭐ Priorities"],["shopping","🛒 Shopping"],["notes","📝 Notes"],["library","📦 Products"],["settings","⚙️ Settings"]].map(([k,v]) => (
                  <button key={k} onClick={() => setView(k)} style={{ padding:"6px 12px", fontSize:13, borderRadius:"var(--border-radius-md)", background: view===k ? "var(--color-background-info)" : "transparent", color: view===k ? "var(--color-text-info)" : "var(--color-text-secondary)", border: view===k ? "0.5px solid var(--color-border-info)" : "0.5px solid transparent", fontWeight: view===k ? 500 : 400 }}>{v}</button>
                ))}
              </div>
              <div style={{ display:"flex", gap:6 }}>
                <input ref={importRef} type="file" accept=".json" onChange={importData} style={{ display:"none" }} />
                <button onClick={() => importRef.current.click()} style={{ padding:"6px 12px", fontSize:12, borderRadius:"var(--border-radius-md)", background:"transparent", color:"var(--color-text-secondary)", border:"0.5px solid var(--color-border-tertiary)", cursor:"pointer" }}>⬆ Import</button>
                <button onClick={exportData} style={{ padding:"6px 12px", fontSize:12, borderRadius:"var(--border-radius-md)", background:"#1D9E75", color:"#fff", border:"none", cursor:"pointer", fontWeight:500 }}>⬇ Export</button>
              </div>
            </div>
            {exportMsg && (
              <div style={{ marginTop:10, padding:"8px 12px", background:"#EAF3DE", borderRadius:"var(--border-radius-md)", fontSize:12, fontFamily:"var(--font-sans)", color:"#3B6D11", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <span>✓ <strong>{exportMsg}</strong> downloaded — your email client should open. Attach the file and send it to yourself.</span>
                <button onClick={() => setExportMsg(null)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:14, color:"#3B6D11", padding:"0 0 0 8px" }}>×</button>
              </div>
            )}
          </div>

          {/* Progress bar */}
          <div style={{ background:"var(--color-background-primary)", borderBottom:"0.5px solid var(--color-border-tertiary)", padding:"10px 20px", display:"flex", alignItems:"center", gap:16, fontFamily:"var(--font-sans)" }}>
            <span style={{ fontSize:12, color:"var(--color-text-secondary)", whiteSpace:"nowrap" }}>Year {yearOffset+1} progress</span>
            <div style={{ flex:1, height:6, background:"var(--color-background-secondary)", borderRadius:3, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${totalTasksYear ? Math.round((completedYear/totalTasksYear)*100) : 0}%`, background:"#1D9E75", borderRadius:3, transition:"width 0.4s" }} />
            </div>
            <span style={{ fontSize:12, color:"var(--color-text-secondary)", whiteSpace:"nowrap" }}>{completedYear}/{totalTasksYear} tasks</span>
          </div>

          <div style={{ display:"flex", alignItems:"flex-start", maxWidth:1120, margin:"0 auto", padding:"0 20px" }}>
          <div style={{ flex:1, minWidth:0, paddingTop:16, paddingRight:20 }}>

            {/* CALENDAR VIEW */}
            {view === "calendar" && (
              <div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(0, 1fr))", gap:0, background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:"var(--border-radius-lg)", overflow:"hidden", marginBottom:20 }}>
                  {MONTHS.map((m, i) => {
                    const tasks = monthTasks(i), prog = getMonthProgress(i), isActive = i === activeMonth;
                    const hasCritical = tasks.some(t => t.priority === "critical" && !isCompleted(t.id, i+1));

                    <div style={{ fontSize:12, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)" }}>{filtered.length} products · {userSeason}-season grass</div>
                    <button onClick={() => setShowAllLibProducts(a => !a)} style={{ fontSize:12, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)", background:"none", border:"none", cursor:"pointer", textDecoration:"underline" }}>
                      {showAllLibProducts ? "Show compatible only" : "Show all products"}
                    </button>
                  </div>
                  {filtered.length === 0 ? (
                    <div style={{ background:"var(--color-background-secondary)", borderRadius:"var(--border-radius-lg)", padding:24, textAlign:"center", fontFamily:"var(--font-sans)", color:"var(--color-text-secondary)" }}>No products found for this filter. Try "Show all products".</div>
                  ) : (
                    visibleCats.map(cat => {
                      const catProds = byCat[cat] || [];
                      if (!catProds.length) return null;
                      const label = SHOP_CAT_LABELS[cat]?.label || cat;
                      return (
                        <div key={cat}>
                          <div style={{ fontSize:13, fontWeight:600, fontFamily:"var(--font-sans)", color:"var(--color-text-secondary)", marginBottom:8, textTransform:"uppercase", letterSpacing:"0.05em" }}>{label}</div>
                          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                            {catProds.map(prod => {
                              const inPlan = planItemNames.some(n => n.toLowerCase().includes(prod.name.toLowerCase().split(" ").slice(0,2).join(" ").toLowerCase()));
                              return (
                                <div key={prod.id} style={{ background:"var(--color-background-primary)", border:`0.5px solid ${inPlan ? "#1D9E75" : "var(--color-border-tertiary)"}`, borderRadius:"var(--border-radius-lg)", padding:"12px 14px" }}>
                                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, marginBottom:4 }}>
                                    <div style={{ fontFamily:"var(--font-sans)", fontSize:14, fontWeight:500, color:"var(--color-text-primary)" }}>{prod.name}</div>
                                    {inPlan && <span style={{ fontSize:10, fontFamily:"var(--font-sans)", padding:"2px 7px", borderRadius:99, background:"#E1F5EE", color:"#0F6E56", flexShrink:0 }}>In your plan</span>}
                                  </div>
                                  <div style={{ fontSize:12, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)", marginBottom:6 }}>{prod.price} · {prod.where}</div>
                                  {prod.researchNote && <div style={{ fontSize:12, color:"var(--color-text-tertiary)", fontFamily:"var(--font-sans)", marginBottom:6, fontStyle:"italic" }}>{prod.researchNote}</div>}
                                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                                    {prod.zones && prod.zones.map(z => <span key={z} style={{ fontSize:10, fontFamily:"var(--font-sans)", padding:"1px 6px", borderRadius:99, background:"var(--color-background-secondary)", color:"var(--color-text-secondary)" }}>Zone {z}</span>)}
                                    {prod.grassSeasonType && prod.grassSeasonType !== "any" && <span style={{ fontSize:10, fontFamily:"var(--font-sans)", padding:"1px 6px", borderRadius:99, background:"var(--color-background-secondary)", color:"var(--color-text-secondary)" }}>{prod.grassSeasonType}-season</span>}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              );
            })()}

            {/* SETTINGS VIEW */}
            {view === "settings" && (() => {
              const sit = SITUATIONS[data.situation];
              const label = s => ({ fontSize:12, fontWeight:600, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:6, display:"block" });
              const sectionBox = { background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:"var(--border-radius-lg)", padding:"14px 16px", marginBottom:16 };
              const disabledIds = data.disabledTasks || [];
              const disabledTaskObjs = TASK_CATALOG.filter(t => disabledIds.includes(t.id));
              return (
                <div style={{ display:"flex", flexDirection:"column", gap:0 }}>
                  {/* Situation */}
                  <span style={label()}>Lawn Situation</span>
                  <div style={sectionBox}>
                    {sit ? (
                      <>
                        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                          <span style={{ fontSize:24 }}>{sit.icon}</span>
                          <div>
                            <div style={{ fontSize:15, fontWeight:500, fontFamily:"var(--font-sans)", color:"var(--color-text-primary)" }}>{sit.label}</div>
                            <div style={{ fontSize:12, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)" }}>{sit.description}</div>
                          </div>
                        </div>
                        <button onClick={() => setData(d => ({ ...d, situation:null, hasCompletedSetup:false }))}
                          style={{ fontSize:12, fontFamily:"var(--font-sans)", padding:"6px 12px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-secondary)", background:"transparent", color:"var(--color-text-secondary)", cursor:"pointer" }}>
                          Change situation →
                        </button>
                        <div style={{ fontSize:11, color:"var(--color-text-tertiary)", fontFamily:"var(--font-sans)", marginTop:8 }}>Changing your situation resets the task plan. Completed tasks and notes are preserved.</div>
                      </>
                    ) : (
                      <div style={{ fontSize:13, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)" }}>No situation set. <button onClick={() => setData(d => ({ ...d, hasCompletedSetup:false }))} style={{ background:"none", border:"none", color:"#1D9E75", cursor:"pointer", fontSize:13, fontFamily:"var(--font-sans)" }}>Run setup wizard</button></div>
                    )}
                  </div>

                  {/* Location */}
                  <span style={label()}>Location &amp; Climate Zone</span>
                  <div style={sectionBox}>
                    <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                      <div>
                        <div style={{ fontSize:12, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)", marginBottom:4 }}>City, State</div>
                        <input value={data.location} onChange={e => setData(d => ({ ...d, location:e.target.value }))}
                          placeholder="e.g. Chicago, IL"
                          style={{ width:"100%", padding:"8px 10px", fontSize:13, fontFamily:"var(--font-sans)", border:"0.5px solid var(--color-border-secondary)", borderRadius:"var(--border-radius-md)", background:"var(--color-background-secondary)", color:"var(--color-text-primary)", boxSizing:"border-box" }} />
                      </div>
                      <div>
                        <div style={{ fontSize:12, color:"var(--color-text-secondary)", fontFamily:"var(--font-sans)", marginBottom:4 }}>USDA Hardiness Zone</div>
                        <select value={data.zone} onChange={e => setData(d => ({ ...d, zone:e.target.value }))}
                          style={{ width:"100%", padding:"8px 10px", fontSize:13, fontFamily:"var(--font-sans)", border:"0.5px solid var(--color-border-secondary)", borderRadius:"var(--border-radius-md)", background:"var(--color-background-secondary)", color:"var(--color-text-primary)" }}>
                          {ZONES.map(z => <option key={z} value={z}>Zone {z}</option>)}
                        </select>
                      </div>
                      <img src="https://planthardiness.ars.usda.gov/images/map.jpg" alt="USDA Zone Map"
                        onError={e => e.target.style.display="none"}
                        style={{ width:"100%", borderRadius:"var(--border-radius-md)", marginTop:4 }} />
                    </div>
                  </div>

                  {/* Grass type */}
                  <span style={label()}>Grass Type</span>
                  <div style={sectionBox}>
                    <select value={data.grassType} onChange={e => setData(d => ({ ...d, grassType:e.target.value }))}
                      style={{ width:"100%", padding:"8px 10px", fontSize:13, fontFamily:"var(--font-sans)", border:"0.5px solid var(--color-border-secondary)", borderRadius:"var(--border-radius-md)", background:"var(--color-background-secondary)", color:"var(--color-text-primary)", marginBottom:10 }}>
                      {Object.entries(GRASS_TYPES).map(([group, types]) => (
                        <optgroup key={group} label={group}>
                          {types.map(t => <option key={t} value={t}>{t}</option>)}
                        </optgroup>
                      ))}
                    </select>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Grass_identification_chart.jpg/640px-Grass_identification_chart.jpg" alt="Grass ID chart"
                      onError={e => e.target.style.display="none"}
                      style={{ width:"100%", borderRadius:"var(--border-radius-md)" }} />
                  </div>

                  {/* Budget */}
                  <span style={label()}>Budget Tier</span>
                  <div style={sectionBox}>
                    <div style={{ display:"flex", gap:8 }}>
                      {Object.entries(BUDGET_TIERS).map(([k, v]) => (
                        <button key={k} onClick={() => setData(d => ({ ...d, budget:k }))}
                          style={{ flex:1, padding:"10px 6px", borderRadius:"var(--border-radius-md)", border:`0.5px solid ${data.budget===k ? "#1D9E75" : "var(--color-border-secondary)"}`, background: data.budget===k ? "#E1F5EE" : "var(--color-background-secondary)", color: data.budget===k ? "#0F6E56" : "var(--color-text-secondary)", fontSize:13, fontFamily:"var(--font-sans)", cursor:"pointer", fontWeight: data.budget===k ? 600 : 400 }}>
                          {BUDGET_TIER_ICON[k]?.badge} {v}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Year */}
                  <span style={label()}>Calendar Year</span>
                  <div style={sectionBox}>
                    <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                      <button onClick={() => setData(d => ({ ...d, year:(d.year||new Date().getFullYear())-1 }))}
                        style={{ padding:"6px 12px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-secondary)", background:"transparent", color:"var(--color-text-secondary)", fontSize:13, fontFamily:"var(--font-sans)", cursor:"pointer" }}>−</button>
                      <span style={{ fontSize:20, fontWeight:500, fontFamily:"var(--font-sans)", color:"var(--color-text-primary)" }}>{data.year || new Date().getFullYear()}</span>
                      <button onClick={() => setData(d => ({ ...d, year:(d.year||new Date().getFullYear())+1 }))}
                        style={{ padding:"6px 12px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-secondary)", background:"transparent", color:"var(--color-text-secondary)", fontSize:13, fontFamily:"var(--font-sans)", cursor:"pointer" }}>+</button>
                    </div>
                  </div>

                  {/* Disabled tasks */}
                  {disabledTaskObjs.length > 0 && (
                    <>
                      <span style={label()}>Removed Tasks</span>
                      <div style={sectionBox}>
                        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                          {disabledTaskObjs.map(t => (
                            <div key={t.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10 }}>
                              <span style={{ fontSize:13, fontFamily:"var(--font-sans)", color:"var(--color-text-secondary)" }}>{t.title}</span>
                              <button onClick={() => setData(d => ({ ...d, disabledTasks:(d.disabledTasks||[]).filter(id => id !== t.id) }))}
                                style={{ fontSize:12, fontFamily:"var(--font-sans)", padding:"4px 10px", borderRadius:"var(--border-radius-md)", border:"0.5px solid #1D9E75", background:"transparent", color:"#1D9E75", cursor:"pointer", flexShrink:0 }}>
                                Restore
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  {/* Data */}
                  <span style={label()}>Data</span>
                  <div style={sectionBox}>
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      <button onClick={exportData}
                        style={{ padding:"8px 14px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-secondary)", background:"transparent", color:"var(--color-text-secondary)", fontSize:13, fontFamily:"var(--font-sans)", cursor:"pointer", textAlign:"left" }}>
                        Export data (JSON)
                      </button>
                      <label style={{ padding:"8px 14px", borderRadius:"var(--border-radius-md)", border:"0.5px solid var(--color-border-secondary)", background:"transparent", color:"var(--color-text-secondary)", fontSize:13, fontFamily:"var(--font-sans)", cursor:"pointer" }}>
                        Import data (JSON)
                        <input type="file" accept=".json" onChange={importData} style={{ display:"none" }} />
                      </label>
                      <button onClick={() => { if (window.confirm("Reset all data? This cannot be undone.")) { localStorage.removeItem("lawn_pro_data_v2"); window.location.reload(); } }}
                        style={{ padding:"8px 14px", borderRadius:"var(--border-radius-md)", border:"0.5px solid #A32D2D", background:"transparent", color:"#A32D2D", fontSize:13, fontFamily:"var(--font-sans)", cursor:"pointer", textAlign:"left" }}>
                        Reset all data
                      </button>
                    </div>
                  </div>
                </div>
              );
            })()}

          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(
    React.createElement(React.StrictMode, null, React.createElement(LawnPro))
  );
</script>
</body>
</html>
